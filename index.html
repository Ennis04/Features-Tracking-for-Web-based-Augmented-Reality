<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feature Tracking for Web-based Augmented Reality</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-container">
    <header class="page-header">
      <h1>Feature Tracking for Web-based Augmented Reality</h1>
      <p class="subtitle">
        Upload an image to generate AR features-based markers.
      </p>
    </header>

    <main class="content-grid">
      <section class="card upload-card">
        <h2>Upload Image</h2>
        <p class="section-description">
          Select an image file from your device to begin.
        </p>

        <label for="image-upload" class="upload-box">
          <span class="upload-icon">📁</span>
          <span class="upload-title">Choose an image</span>
          <input type="file" id="image-upload" accept="image/*" hidden />
        </label>

        <p id="file-name" class="file-name">No file selected</p>
      </section>

      <section class="card preview-card">
        <h2>Preview</h2>

        <div id="preview-box" class="preview-box">
          <span id="preview-placeholder" class="preview-placeholder">Preview</span>
          <img id="image-preview" src="" alt="Image Preview" />
          <canvas id="preview-canvas"></canvas>
        </div>

        <div id="action-buttons" class="button-group hidden">
          <button id="generate-btn" class="btn btn-primary" type="button">
            Generate
          </button>
          <button id="link-model-btn" class="btn btn-secondary btn-disabled" type="button" disabled>
            Link 3D Model
          </button>
          <button id="save-btn" class="btn btn-secondary btn-disabled" type="button" disabled>
            Save
          </button>
        </div>

        <div id="model-panel" class="model-panel hidden">
          <h3>Select 3D Model</h3>
          <p class="model-description">
            Choose one predefined 3D model shape.
          </p>

          <div class="model-select-section">
            <label for="model-select" class="input-label">3D Model Options</label>
            <select id="model-select" class="model-select">
              <option value="">-- Select a model --</option>
              <option value="sphere">Sphere</option>
              <option value="cube">Cube</option>
              <option value="pyramid">Pyramid</option>
              <option value="cuboid">Cuboid</option>
            </select>
          </div>
          
          <button id="start-ar-btn" class="btn btn-secondary btn-disabled" type="button" disabled>
            Start AR
          </button>
        </div>

        <p id="status-message" class="status-message"></p>
      </section>
    </main>
  </div>

  <div id="ar-view" class="ar-view hidden">
    <video id="ar-video" autoplay playsinline></video>
    <canvas id="ar-overlay-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none;"></canvas>
    <button id="back-btn" class="back-btn" type="button">Back</button>
  </div>

  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
  <script src="app.js"></script>
</body>
</html>
